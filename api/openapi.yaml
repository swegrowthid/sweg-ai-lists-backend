openapi: 3.0.3
info:
  title: sweg-ai-lists-backend
  version: 0.1.0
  description: Backend komunitas sweg-ai. Satu sumber kontrak API.
servers:
  - url: /
    description: Same host - browser pakai host aktif, tanpa CORS tambahan.
paths:
  /healthz:
    get:
      summary: Liveness - proses hidup
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /readyz:
    get:
      summary: Readiness - siap terima trafik
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: Not ready (db down)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /users/register:
    post:
      summary: Register user
      operationId: registerUser
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User berhasil dibuat tanpa password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Request tidak valid
          content:
            text/plain:
              schema:
                type: string
        "409":
          description: Username atau email sudah terdaftar
          content:
            text/plain:
              schema:
                type: string
        "500":
          description: Galat server
  /users:
    get:
      summary: List users
      operationId: listUsers
      tags: [users]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Daftar user tanpa password_hash
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "401":
          description: Token hilang, tidak valid, atau kadaluarsa
          content:
            text/plain:
              schema:
                type: string
        "500":
          description: Galat server
  /auth/login:
    post:
      summary: Login - identifier terima username atau email
      operationId: login
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login berhasil, access + refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "400":
          description: Request tidak valid
          content:
            text/plain:
              schema:
                type: string
        "401":
          description: Identifier atau password salah (pesan generik)
          content:
            text/plain:
              schema:
                type: string
        "500":
          description: Galat server
  /auth/refresh:
    post:
      summary: Rotasi refresh token - token lama langsung mati
      operationId: refreshTokens
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Token pair baru
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "400":
          description: Request tidak valid
          content:
            text/plain:
              schema:
                type: string
        "401":
          description: Refresh token tidak valid, kadaluarsa, atau sudah dipakai
          content:
            text/plain:
              schema:
                type: string
        "500":
          description: Galat server
  /auth/logout:
    post:
      summary: Logout - cabut refresh token
      operationId: logout
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "204":
          description: Refresh token dicabut
        "400":
          description: Request tidak valid
          content:
            text/plain:
              schema:
                type: string
        "401":
          description: Refresh token tidak valid atau kadaluarsa
          content:
            text/plain:
              schema:
                type: string
        "500":
          description: Galat server
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Health:
      type: object
      required: [status, version, uptime_s]
      properties:
        status:
          type: string
          enum: [ok, fail]
        version:
          type: string
        uptime_s:
          type: integer
        checks:
          type: object
          additionalProperties:
            type: string
    LoginRequest:
      type: object
      required: [identifier, password]
      additionalProperties: false
      properties:
        identifier:
          type: string
          description: Username atau email
          example: budi
        password:
          type: string
          format: password
          writeOnly: true
          example: secret-password
    RefreshRequest:
      type: object
      required: [refresh_token]
      additionalProperties: false
      properties:
        refresh_token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
    TokenPair:
      type: object
      required: [access_token, token_type, expires_in, refresh_token, refresh_expires_in]
      properties:
        access_token:
          type: string
          description: JWT HS256, kirim sebagai Authorization Bearer
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          description: Umur access token dalam detik
          example: 900
        refresh_token:
          type: string
          description: JWT HS256 satu kali pakai, rotasi di /auth/refresh
        refresh_expires_in:
          type: integer
          description: Umur refresh token dalam detik
          example: 604800
    RegisterRequest:
      type: object
      required: [username, email, password]
      additionalProperties: false
      properties:
        username:
          type: string
          minLength: 3
          example: budi
        email:
          type: string
          format: email
          example: Budi@Test.ID
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 72
          writeOnly: true
          example: secret-password
    User:
      type: object
      required: [id, username, email, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
          example: 9f28f61b-8177-4b63-82a2-ff2388680543
        username:
          type: string
          example: budi
        email:
          type: string
          format: email
          example: budi@test.id
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
tags:
  - name: users
    description: Data user komunitas.
  - name: auth
    description: Login, refresh, dan logout token.
