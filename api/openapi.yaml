openapi: 3.0.3
info:
  title: sweg-ai-lists-backend
  version: 0.1.0
  description: Backend komunitas sweg-ai. Satu sumber kontrak API.
servers:
  - url: /
    description: Same host - browser pakai host aktif, tanpa CORS tambahan.
paths:
  /healthz:
    get:
      summary: Liveness - proses hidup
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /readyz:
    get:
      summary: Readiness - siap terima trafik
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: Not ready (db down)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /users/register:
    post:
      summary: Register user
      operationId: registerUser
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User berhasil dibuat tanpa password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Request tidak valid
          content:
            text/plain:
              schema:
                type: string
        "409":
          description: Username atau email sudah terdaftar
          content:
            text/plain:
              schema:
                type: string
        "500":
          description: Galat server
  /users:
    get:
      summary: List users
      operationId: listUsers
      tags: [users]
      responses:
        "200":
          description: Daftar user tanpa password_hash
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "500":
          description: Galat server
components:
  schemas:
    Health:
      type: object
      required: [status, version, uptime_s]
      properties:
        status:
          type: string
          enum: [ok, fail]
        version:
          type: string
        uptime_s:
          type: integer
        checks:
          type: object
          additionalProperties:
            type: string
    RegisterRequest:
      type: object
      required: [username, email, password]
      additionalProperties: false
      properties:
        username:
          type: string
          minLength: 3
          example: budi
        email:
          type: string
          format: email
          example: Budi@Test.ID
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 72
          writeOnly: true
          example: secret-password
    User:
      type: object
      required: [id, username, email, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
          example: 9f28f61b-8177-4b63-82a2-ff2388680543
        username:
          type: string
          example: budi
        email:
          type: string
          format: email
          example: budi@test.id
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
tags:
  - name: users
    description: Data user komunitas.
