openapi: 3.0.3
info:
  title: sweg-ai-lists-backend
  version: 0.1.0
  description: Backend komunitas sweg-ai. Satu sumber kontrak API.
servers:
  - url: /
    description: Same host by default. Cross-origin browser calls (frontend statis) butuh origin-nya di env CORS_ORIGINS.
paths:
  /healthz:
    get:
      summary: Liveness - proses hidup
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /readyz:
    get:
      summary: Readiness - siap terima trafik
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: Not ready (db down)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /users/register:
    post:
      summary: Register user
      operationId: registerUser
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User berhasil dibuat tanpa password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Request tidak valid
          content:
            text/plain:
              schema:
                type: string
        "409":
          description: Username atau email sudah terdaftar
          content:
            text/plain:
              schema:
                type: string
        "500":
          description: Galat server
  /users:
    get:
      summary: List users
      operationId: listUsers
      tags: [users]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Daftar user tanpa password_hash
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "401":
          description: Token hilang, tidak valid, atau kadaluarsa
          content:
            text/plain:
              schema:
                type: string
        "500":
          description: Galat server
  /users/password:
    put:
      summary: Ganti password milik sendiri - cabut semua sesi refresh
      operationId: changePassword
      tags: [users]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Password diganti, semua refresh token user dicabut
        "400":
          description: Request tidak valid atau password baru tidak valid
          content:
            text/plain:
              schema:
                type: string
        "401":
          description: Token hilang, tidak valid, atau kadaluarsa; atau password lama salah
          content:
            text/plain:
              schema:
                type: string
        "500":
          description: Galat server
  /categories:
    get:
      summary: Daftar category
      operationId: listCategories
      tags: [categories]
      responses:
        "200":
          description: Daftar semua category
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
        "500":
          description: Galat server
    post:
      summary: Buat category
      operationId: createCategory
      tags: [categories]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCategoryRequest"
      responses:
        "201":
          description: Category berhasil dibuat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          description: Request tidak valid
          content:
            text/plain:
              schema:
                type: string
        "401":
          description: Token hilang, tidak valid, atau kadaluarsa
          content:
            text/plain:
              schema:
                type: string
        "409":
          description: Slug sudah dipakai
          content:
            text/plain:
              schema:
                type: string
        "500":
          description: Galat server
  /posts:
    get:
      summary: Daftar post
      operationId: listPosts
      tags: [posts]
      parameters:
        - name: category
          in: query
          required: false
          description: Filter slug category. Induk ikut mencocokkan turunannya.
          schema:
            type: string
          example: coding-agent
        - name: q
          in: query
          required: false
          description: Cari pada judul, case-insensitive.
          schema:
            type: string
          example: claude
      responses:
        "200":
          description: Daftar post terbaru dulu, tanpa items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Post"
        "400":
          description: Filter tidak valid, misalnya category atau q memuat byte NUL
          content:
            text/plain:
              schema:
                type: string
        "500":
          description: Galat server
    post:
      summary: Buat post
      operationId: createPost
      tags: [posts]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePostRequest"
      responses:
        "201":
          description: Post berhasil dibuat langsung published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "400":
          description: Request tidak valid atau category tidak dikenal
          content:
            text/plain:
              schema:
                type: string
        "401":
          description: Token hilang, tidak valid, atau kadaluarsa; atau user pembuat token sudah tidak ada
          content:
            text/plain:
              schema:
                type: string
        "409":
          description: Slug sudah dipakai
          content:
            text/plain:
              schema:
                type: string
        "500":
          description: Galat server
  /posts/{slug}:
    get:
      summary: Detail post
      operationId: getPost
      tags: [posts]
      parameters:
        - name: slug
          in: path
          required: true
          description: Slug post.
          schema:
            type: string
      responses:
        "200":
          description: Post dengan items urut position
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "404":
          description: Post tidak ditemukan
          content:
            text/plain:
              schema:
                type: string
        "500":
          description: Galat server
    delete:
      summary: Hapus post - hanya pemilik
      operationId: deletePost
      tags: [posts]
      security:
        - bearerAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          description: Slug post.
          schema:
            type: string
      responses:
        "204":
          description: Post berhasil dihapus
        "401":
          description: Token hilang, tidak valid, atau kadaluarsa
          content:
            text/plain:
              schema:
                type: string
        "403":
          description: Post milik user lain
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: Post tidak ditemukan
          content:
            text/plain:
              schema:
                type: string
        "500":
          description: Galat server
  /news:
    get:
      summary: Daftar news - post AI Tools Digest dari zainfathoni.com
      operationId: listNews
      tags: [news]
      responses:
        "200":
          description: Daftar news terbit terbaru dulu. Diisi sync harian, bukan lewat endpoint tulis.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NewsEntry"
        "500":
          description: Galat server
  /tools:
    get:
      summary: Daftar tools AI dari repo tools-ai-swe-growth
      operationId: listTools
      tags: [tools]
      parameters:
        - name: group
          in: query
          required: false
          description: >-
            Filter grup. `all` mengembalikan tiap kategori. Nilai lain memilih satu
            grup. Parameter ini sama fungsinya dengan `category`.
          schema:
            type: string
            enum: [all, ade, provider, coding-agent]
            default: all
          example: provider
        - name: category
          in: query
          required: false
          description: Nama lama untuk `group`. Terima slug atau prefix id, case-insensitive.
          schema:
            type: string
            enum: [providers, coding-agents, ade, p, ca]
          example: providers
        - name: q
          in: query
          required: false
          description: Cari pada nama tool, case-insensitive.
          schema:
            type: string
          example: cursor
        - name: sort
          in: query
          required: false
          description: >-
            Kunci urutan. Tanpa parameter ini baris tetap urut katalog sumber.
            `updated` memakai tanggal update sumber. Tanggal itu satu-satunya
            stempel waktu di katalog, jadi ia mewakili waktu tambah dan ubah.
          schema:
            type: string
            enum: [name, updated]
          example: name
        - name: order
          in: query
          required: false
          description: Arah urutan. Hanya berlaku bila `sort` terisi. Default asc.
          schema:
            type: string
            enum: [asc, desc]
            default: asc
          example: desc
        - name: page
          in: query
          required: false
          description: Nomor halaman, mulai dari 1.
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 2
        - name: per_page
          in: query
          required: false
          description: Jumlah baris per halaman. Nilai di luar 1..100 ditolak.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          example: 50
      responses:
        "200":
          description: >-
            Satu halaman tool plus meta paging. `meta.total` menghitung seluruh baris
            yang cocok dengan filter, bukan hanya baris pada halaman ini. Halaman
            kosong tetap membawa meta, jadi klien bisa membedakan "habis" dari
            "tidak ada yang cocok".
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolList"
        "400":
          description: >-
            Parameter tidak valid. Contoh: group tak dikenal, sort atau order tak
            didukung, page di bawah 1, per_page di luar 1..100, atau q memuat byte NUL.
          content:
            text/plain:
              schema:
                type: string
        "500":
          description: Galat server
  /tools/categories:
    get:
      summary: Mapping kategori tools - slug, nama, prefix, file sumber, jumlah baris
      operationId: listToolCategories
      tags: [tools]
      responses:
        "200":
          description: Daftar 3 kategori tools beserta jumlah baris hasil sync terakhir
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ToolCategory"
        "500":
          description: Galat server
  /tools/{id}:
    get:
      summary: Detail satu tool berdasarkan id sumber
      operationId: getTool
      tags: [tools]
      parameters:
        - name: id
          in: path
          required: true
          description: Id tool dari tabel sumber, case-insensitive.
          schema:
            type: string
          example: P-001
      responses:
        "200":
          description: Satu tool dari snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tool"
        "404":
          description: Tool tidak ditemukan
          content:
            text/plain:
              schema:
                type: string
        "500":
          description: Galat server
  /auth/login:
    post:
      summary: Login - identifier terima username atau email
      operationId: login
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login berhasil, access + refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "400":
          description: Request tidak valid
          content:
            text/plain:
              schema:
                type: string
        "401":
          description: Identifier atau password salah (pesan generik)
          content:
            text/plain:
              schema:
                type: string
        "500":
          description: Galat server
  /auth/refresh:
    post:
      summary: Rotasi refresh token - token lama langsung mati
      operationId: refreshTokens
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Token pair baru
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "400":
          description: Request tidak valid
          content:
            text/plain:
              schema:
                type: string
        "401":
          description: Refresh token tidak valid, kadaluarsa, atau sudah dipakai
          content:
            text/plain:
              schema:
                type: string
        "500":
          description: Galat server
  /auth/logout:
    post:
      summary: Logout - cabut refresh token
      operationId: logout
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "204":
          description: Refresh token dicabut
        "400":
          description: Request tidak valid
          content:
            text/plain:
              schema:
                type: string
        "401":
          description: Refresh token tidak valid atau kadaluarsa
          content:
            text/plain:
              schema:
                type: string
        "500":
          description: Galat server
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Health:
      type: object
      required: [status, version, uptime_s]
      properties:
        status:
          type: string
          enum: [ok, fail]
        version:
          type: string
        uptime_s:
          type: integer
        checks:
          type: object
          additionalProperties:
            type: string
    LoginRequest:
      type: object
      required: [identifier, password]
      additionalProperties: false
      properties:
        identifier:
          type: string
          description: Username atau email
          example: budi
        password:
          type: string
          format: password
          writeOnly: true
          example: secret-password
    RefreshRequest:
      type: object
      required: [refresh_token]
      additionalProperties: false
      properties:
        refresh_token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
    TokenPair:
      type: object
      required: [access_token, token_type, expires_in, refresh_token, refresh_expires_in]
      properties:
        access_token:
          type: string
          description: JWT HS256, kirim sebagai Authorization Bearer
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          description: Umur access token dalam detik
          example: 900
        refresh_token:
          type: string
          description: JWT HS256 satu kali pakai, rotasi di /auth/refresh
        refresh_expires_in:
          type: integer
          description: Umur refresh token dalam detik
          example: 604800
    RegisterRequest:
      type: object
      required: [username, email, password]
      additionalProperties: false
      properties:
        username:
          type: string
          minLength: 3
          example: budi
        email:
          type: string
          format: email
          example: Budi@Test.ID
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 72
          writeOnly: true
          example: secret-password
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      additionalProperties: false
      properties:
        current_password:
          type: string
          format: password
          writeOnly: true
          example: secret-password
        new_password:
          type: string
          format: password
          minLength: 1
          maxLength: 72
          writeOnly: true
          example: new-secret-password
    User:
      type: object
      required: [id, username, email, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
          example: 9f28f61b-8177-4b63-82a2-ff2388680543
        username:
          type: string
          example: budi
        email:
          type: string
          format: email
          example: budi@test.id
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Category:
      type: object
      required: [id, slug, name, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          example: coding-agent
        name:
          type: string
          example: Coding Agent
        parent_slug:
          type: string
          nullable: true
          description: Slug induk; null berarti top-level. Maksimal dua level.
          example: coding
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateCategoryRequest:
      type: object
      required: [slug, name]
      additionalProperties: false
      properties:
        slug:
          type: string
          maxLength: 100
          description: Huruf kecil, angka, dan tanda hubung. Unik.
          example: coding-agent
        name:
          type: string
          maxLength: 100
          example: Coding Agent
        parent:
          type: string
          maxLength: 100
          description: Slug induk, opsional. Induk harus top-level.
          example: coding
    PostItem:
      type: object
      required: [id, kind, position]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [markdown, text, link, file]
        position:
          type: integer
          minimum: 0
          description: Urutan tampil. Server mengisi dari urutan array items.
        body_text:
          type: string
          description: "Isi markdown, text, atau file kecil inline. Jangan dikirim pada kind link. Maksimal 64 KiB."
        url:
          type: string
          format: uri
          description: "Wajib dan hanya untuk kind link. Harus http atau https."
        filename:
          type: string
          description: "Wajib dan hanya untuk kind file."
        mime:
          type: string
          description: "Hanya untuk kind file. Default text/markdown."
    Post:
      type: object
      required: [id, slug, title, author_id, categories, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          example: setup-claude-code
        title:
          type: string
          example: Setup Claude Code
        author_id:
          type: string
          format: uuid
          description: User pembuat post.
        categories:
          type: array
          description: Minimal satu.
          items:
            $ref: "#/components/schemas/Category"
        items:
          type: array
          description: "Terisi pada POST /posts dan GET /posts/{slug}, urut menurut position. Kosong pada daftar."
          items:
            $ref: "#/components/schemas/PostItem"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreatePostRequest:
      type: object
      required: [title, category, items]
      additionalProperties: false
      properties:
        slug:
          type: string
          maxLength: 100
          description: Huruf kecil, angka, dan tanda hubung. Unik. Dibuat otomatis dari title bila tidak dikirim.
          example: setup-claude-code
        title:
          type: string
          maxLength: 200
          example: Setup Claude Code
        category:
          type: string
          maxLength: 100
          description: Slug category yang sudah ada, top-level atau turunan. Slug turunan otomatis ikut menyambung induknya.
          example: coding
        derivative:
          type: string
          maxLength: 100
          description: "Slug turunan langsung, opsional. Harus anak dari category. Tidak perlu dikirim bila category sudah menyebut slug turunan."
          example: claude-code
        items:
          type: array
          minItems: 1
          maxItems: 20
          description: "Urutan array menjadi urutan tampil. Kirim hanya field milik kind: field lain ditolak walau kosong. Body maksimal 1 MiB."
          items:
            type: object
            required: [kind]
            additionalProperties: false
            properties:
              kind:
                type: string
                enum: [markdown, text, link, file]
              body_text:
                type: string
                description: "Wajib untuk kind markdown, text, dan file. Maksimal 64 KiB."
              url:
                type: string
                format: uri
                description: "Wajib untuk kind link. Harus http atau https."
              filename:
                type: string
                description: "Wajib untuk kind file."
              mime:
                type: string
                description: "Opsional untuk kind file. Default text/markdown."
    NewsEntry:
      type: object
      required: [id, title, url, summary, published_at, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          example: "Pintar, Murah, atau Terlihat Kerjanya? — AI Tools Digest #35"
        url:
          type: string
          format: uri
          description: URL post asli di blog sumber. Kunci unik baris ini.
        summary:
          type: string
          description: Ringkasan dari kartu listing sumber. Boleh string kosong.
        published_at:
          type: string
          format: date-time
          description: Tengah malam UTC dari tanggal terbit kartu sumber.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ToolCategory:
      type: object
      required: [slug, name, prefix, source_file, source_url, count]
      properties:
        slug:
          type: string
          example: providers
        name:
          type: string
          example: Providers
        prefix:
          type: string
          description: Prefix id baris di tabel sumber.
          example: P
        source_file:
          type: string
          description: Nama file markdown di repo tools-ai-swe-growth.
          example: providers.md
        source_url:
          type: string
          format: uri
          description: Halaman GitHub file sumber untuk dibaca manusia.
        count:
          type: integer
          description: Jumlah baris pada snapshot sync terakhir. 0 sebelum sync pertama.
    Tool:
      type: object
      required: [id, category, name, website, website_label, status, updated]
      properties:
        id:
          type: string
          description: Id dari tabel sumber, bentuk PREFIX-NNN.
          example: P-001
        category:
          type: string
          enum: [providers, coding-agents, ade]
        name:
          type: string
          example: OpenAI
        website:
          type: string
          format: uri
          description: URL dari sel Website sumber. Kosong bila sel bukan link.
          example: https://openai.com
        website_label:
          type: string
          description: Teks tampil dari sel Website sumber.
          example: openai.com
        status:
          type: string
          description: Status lowercase dari sumber, emoji dibuang.
          example: active
        updated:
          type: string
          description: Tanggal update sumber YYYY-MM-DD. Teks mentah bila sumber menyimpan format lain.
          example: "2026-07-12"
        top_up:
          type: boolean
          description: Hanya kategori providers. Absen pada kategori lain.
        subscribe:
          type: boolean
          description: Hanya kategori providers. Absen pada kategori lain.
        min_spend:
          type: string
          description: Hanya kategori providers. Teks mentah sel Min Spend.
          example: $5 (top up)
        ai_features:
          type: array
          description: Hanya kategori ade. Daftar fitur dari sel AI Features.
          items:
            type: string
          example: ["Chat", "Agent"]
    PageMeta:
      type: object
      required: [page, per_page, total, total_pages]
      properties:
        page:
          type: integer
          description: Nomor halaman yang sedang dikirim, mulai dari 1.
          example: 1
        per_page:
          type: integer
          description: Jumlah baris maksimal per halaman yang dipakai server.
          example: 20
        total:
          type: integer
          description: Jumlah seluruh baris yang cocok dengan filter, semua halaman.
          example: 259
        total_pages:
          type: integer
          description: Jumlah halaman dari total dengan per_page ini. 0 bila tidak ada baris.
          example: 13
    ToolList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
